# Production-style stack: Postgres + web app + dedicated polling worker.
#   cp .env.example .env   # fill in what you need — APP_PASSWORD is required (the app refuses to start without it)
#   docker compose up -d --build
# Containers run in UTC: set TZ in .env (e.g. TZ=America/Vancouver) so follow-ups become due at your
# local midnight.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flipwatch
      POSTGRES_PASSWORD: flipwatch
      POSTGRES_DB: flipwatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipwatch"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://flipwatch:flipwatch@db:5432/flipwatch
      WORKER_MODE: external
    # Only this computer can reach it. To use it from other devices, put a reverse proxy or Tailscale in front,
    # or change this to "3000:3000" — and set APP_URL / ALLOWED_HOSTS to the address you'll use.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    # Not `npm run worker`: npm's shell doesn't forward SIGTERM, so the worker would never shut down cleanly.
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://flipwatch:flipwatch@db:5432/flipwatch
      WORKER_MODE: external
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
